[package]
name = "beholdd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
hag-openmythos = ["hag-native", "beholdd-runtime/hag-openmythos"]
hag-native = ["beholdd-runtime/hag-native"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
beholdd-runtime = { path = "../beholdd-runtime" }
axum = { version = "=0.7.9", features = ["json", "tokio", "http1"] }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "=0.1.18"

[dev-dependencies]
beholdd-embed = { path = "../beholdd-embed" }
beholdd-format = { path = "../beholdd-format" }
beholdd-model = { path = "../beholdd-model" }
http-body-util = "=0.1.3"
tower = { version = "=0.5.3", features = ["util"] }
