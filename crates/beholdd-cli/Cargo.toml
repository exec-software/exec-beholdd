[package]
name = "beholdd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
hag-openmythos = ["hag-native", "beholdd-runtime/hag-openmythos", "beholdd-server/hag-openmythos"]
hag-native = ["beholdd-runtime/hag-native", "beholdd-server/hag-native"]

[[bin]]
name = "beholdd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
beholdd-runtime = { path = "../beholdd-runtime" }
beholdd-server = { path = "../beholdd-server" }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
