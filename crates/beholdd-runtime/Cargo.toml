[package]
name = "beholdd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
hag-native = ["beholdd-backend/hag-native"]
# Explicitly isolated until the complete pinned graph and lifecycle gates pass.
hag-openmythos = ["hag-native", "beholdd-model/hag-native", "dep:sha2"]
test-fault-injection = ["beholdd-memory/test-fault-injection"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_yaml.workspace = true
beholdd-core = { path = "../beholdd-core" }
beholdd-format = { path = "../beholdd-format" }
beholdd-model = { path = "../beholdd-model" }
beholdd-memory = { path = "../beholdd-memory" }
beholdd-backend = { path = "../beholdd-backend" }

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = { version = "=0.10.9", optional = true }
