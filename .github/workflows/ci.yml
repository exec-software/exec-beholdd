name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Default features only: vulkan and hag are opt-in, and nothing here
      # touches a GPU or a Vulkan loader.
      - name: Test the workspace
        run: cargo test --workspace --locked

      # The vulkan feature's build script compiles every compute shader with
      # glslc, so the toolchain has to be present even though no GPU is.
      - name: Install the shader compiler
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends glslc

      # The optional backends are the point of the project, so keep them
      # compiling even though this runner cannot exercise them. ash links the
      # Vulkan loader at runtime and the hag backend builds from the checked
      # vendor snapshot, so beyond glslc neither needs a system library here.
      - name: Check the Vulkan and HAG backends
        run: cargo check --workspace --all-targets --locked --features beholdd-backend/vulkan,beholdd-backend/hag

      # No fmt or clippy gate: the tree is not rustfmt-clean and carries no
      # rustfmt.toml, so adding one would land red. Format first, then gate.
